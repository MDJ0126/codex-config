name: Publish report archive
on:
  push:
    branches: [main]
    paths: ['리포트/**', '.github/workflows/reports-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: report-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node 리포트/build.mjs
      - run: node 리포트/verify.mjs
      - run: node 리포트/verify-migration.mjs
      - run: node 리포트/verify-editorial.mjs
      - run: node --test 리포트/tests/*.test.mjs
      - run: node 리포트/package-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          path: 리포트/.site
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            // Use the upload result directly: name lookup returned zero, then duplicate artifacts on retry.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Invalid Pages upload artifact ID');
            const oidcToken = await core.getIDToken();
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: oidcToken
            });
            core.setOutput('page_url', deployment.page_url);
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            const terminal = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            const deadline = Date.now() + 600000;
            let errors = 0;
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              let status;
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', { ...context.repo, deploymentId });
                status = response.data.status;
                errors = 0;
              } catch (error) {
                if (++errors >= 10) throw error;
                core.warning('Pages status request failed; retrying');
                continue;
              }
              core.info(`Pages deployment status: ${status}`);
              if (status === 'succeed') return;
              if (terminal.has(status)) throw new Error(`Pages deployment failed: ${status}`);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', { ...context.repo, deploymentId });
            throw new Error('Pages deployment timed out');
