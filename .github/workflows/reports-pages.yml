name: Publish report archive
on:
  push:
    branches: [main]
    paths: ['리포트/**', '.github/workflows/reports-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: report-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node 리포트/build.mjs
      - run: node 리포트/verify.mjs
      - run: node 리포트/verify-migration.mjs
      - run: node 리포트/package-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 리포트/.site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
